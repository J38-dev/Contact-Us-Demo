<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="contact-container">
    <h1>Contact Us (Demo)</h1>
    <p>Fill in the form below and we’ll get back to you.</p>

    <form id="contact-form">
      <input type="text" id="name" placeholder="Your Name" required>
      <input type="email" id="email" placeholder="Your Email" required>
      <textarea id="message" placeholder="Your Message" required></textarea>
      <button type="submit">Send Message</button>
    </form>
    <div id="response-message"></div>
  </div>

  <script>
    document.getElementById('contact-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const message = document.getElementById('message').value;
      
      fetch('https://contact-us-demo-r1cinbwj1-kayfalls-projects.vercel.app/api/submit', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ name, email, message })
      })
      .then(response => {
        if (!response.ok) {
          return response.text().then(text => { throw new Error(text || `Server error: ${response.status}`); });
        }
        return response.json();
      })
      .then(data => {
        document.getElementById('response-message').textContent = data.success || 'Message sent successfully';
      })
      .catch(error => {
        console.error('Error:', error);
        document.getElementById('response-message').textContent = error.message || 'An error occurred. Please try again.';
      });
    });
  </script>

</body>
</html>
